<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SDP Formatter</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/highlight.min.js"></script>
    <style>
        :root { --sdp-main-width: 100%; }
        main#sdp-main { width: min(100%, var(--sdp-main-width)); max-width: 100%; }
        /* Reset highlight.js defaults */
        .hljs { background: transparent !important; color: inherit !important; padding: 0 !important; overflow: visible !important;}
        /* Custom highlighting colors for SDP */
        .hljs-meta { color: #86efac; font-weight: bold; }
        /* v= version - green */
        .hljs-keyword { color: #fbbf24; }
        /* o= origin, ICE/security attrs - yellow */
        .hljs-title { color: #60a5fa; }
        /* s= session, codec names - blue */
        .hljs-type { color: #f472b6; font-weight: bold; }
        /* m= media, direction attrs - pink */
        .hljs-variable {color: #a78bfa; }
        /* c= connection, rtcp - purple */
        .hljs-attr { color: #94a3b8; }
        /* a= attributes - slate */
        .hljs-built_in { color: #34d399;}
        /* common attributes (rtpmap, fmtp, etc) - emerald */
        .hljs-number { color: #fca5a5; }
        /* numbers - light red/pink */
        .hljs-string { color: #67e8f9; }
        /* strings/IPs/URLs - cyan */
        .hljs-comment { color: #fb923c; }
        /* t= time, fingerprints - orange */
        .hljs-symbol { color: #c084fc; }
        /* b= bandwidth, UUIDs - violet */
        .hljs-params { color: #9ca3af; }

        /* Textarea & Highlighting Styles */
        #sdp-highlight { overflow: hidden !important; z-index: 1; }
        #sdp-input { z-index: 2; }
        #sdp-input::placeholder { color: #64748b !important; opacity: 1 !important; }
        #sdp-input:focus { border-color: #3b82f6 !important; box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.1) !important; }
        textarea#sdp-input { -webkit-text-fill-color: transparent !important; }
    </style>
    <script>
        tailwind.config = { theme: { extend: {
        colors: {
            primary: '#3b82f6',
            secondary: '#10b981',
            surface: '#1e293b',
            background: '#0f172a',
            border: '#334155',
        }}}};
    </script>

</head>

<body class="bg-background text-slate-200 p-3 text-sm font-sans">
    <div class="flex justify-center min-h-screen p-5">
        <div class="w-full">
            <h1 class="text-primary text-center mb-5 font-bold text-xl">SDP Formatter & Validator</h1>

            <div class="flex flex-col gap-5 xl:flex-row xl:items-start">
                <!-- Main SDP Area -->
                <main id="sdp-main" class="bg-surface p-5 rounded border border-border shadow w-full">
                    <div class="flex items-center justify-between">
                        <label for="sdp-input" class="font-medium text-sm">Paste SDP Here</label>
                        <div id="format-status" class="text-xs text-slate-400"></div>
                    </div>

                    <div class="relative" style="position: relative;">
                        <pre id="sdp-highlight" class="font-mono"
                            style="margin: 0; padding: 0.75rem; white-space: pre-wrap; word-wrap: break-word; overflow-wrap: break-word; position: absolute; top: 0; left: 0; right: 0; pointer-events: none; background: #0f172a; border: 1px solid #334155; border-radius: 0.25rem; overflow: hidden;"><code class="language-sdp"></code></pre>
                        <textarea id="sdp-input" class="font-mono"
                            style="width: 100%; box-sizing: border-box; min-height: 100%; overflow: hidden; resize: none; position: relative; background: transparent !important; color: transparent !important; caret-color: #94a3b8 !important; padding: 0.75rem; border: 1px solid #334155; border-radius: 0.25rem; outline: none;"
                            spellcheck="false" placeholder='Paste your SDP here (raw, JSON, or quoted)...

                        The formatter will automatically detect and format:
                        - Raw SDP text
                        - JSON: {"type":"offer","sdp":"v=0..."}
                        - Quoted strings
                        - Escaped sequences (\r\n, \n, etc.)'></textarea>
                    </div>
                </main>

                <!-- Validation Summary Sidebar -->
                <aside id="validation-summary" class="w-80 bg-surface p-5 rounded border border-border shadow hidden"
                    style="height: calc(40vh); overflow: auto;">
                    <div class="font-semibold mb-3 text-primary">Validation Summary</div>
                    <div id="summary-content"></div>
                </aside>
            </div>
        </div>
    </div>

    <script>
        // Define SDP language for highlight.js
        hljs.registerLanguage('sdp', function (hljs) {
            return {
                name: 'SDP',
                case_insensitive: false,
                contains: [
                    // Version field v=
                    { scope: 'meta', begin: /^v=/m, end: /$/m, relevance: 10 },
                    // Origin field o=
                    { scope: 'keyword', begin: /^o=/m, end: /$/m, contains: [{ scope: 'string', begin: /\S+/, relevance: 0 }], relevance: 10 },
                    // Session name s=
                    { scope: 'title', begin: /^s=/m, end: /$/m, relevance: 10 },
                    // Media m=
                    { scope: 'type', begin: /^m=/m, end: /$/m, contains: [{ scope: 'keyword', match: /\b(audio|video|application|data)\b/, relevance: 5 }, { scope: 'number', match: /\b\d+\b/ }], relevance: 10 },
                    // Connection c=
                    { scope: 'variable', begin: /^c=/m, end: /$/m, contains: [{ scope: 'string', match: /\b(?:\d{1,3}\.){3}\d{1,3}\b/ }], relevance: 5 },
                    // Attributes a= (with enhanced sub-patterns)
                    { scope: 'attr', begin: /^a=/m, end: /$/m, contains: [{ scope: 'built_in', begin: /^a=(rtpmap|fmtp|rtcp-fb|extmap|ssrc|ssrc-group|mid|msid)/m, end: /(?=:|\s|$)/, relevance: 7 }, { scope: 'keyword', begin: /^a=(candidate|ice-ufrag|ice-pwd|ice-options|fingerprint|setup)/m, end: /(?=:|\s|$)/, relevance: 7 }, { scope: 'type', match: /^a=(sendrecv|sendonly|recvonly|inactive)$/m, relevance: 8 }, { scope: 'variable', begin: /^a=(rtcp|rtcp-mux|rtcp-rsize)/m, end: /(?=:|\s|$)/, relevance: 6 }, { scope: 'title', match: /\b(H264|H265|VP8|VP9|AV1|opus|PCMU|PCMA|L16|red|ulpfec|rtx)\b/i, relevance: 5 }, { scope: 'string', match: /(https?:\/\/|urn:)[^\s]+/, relevance: 3 }, { scope: 'string', match: /\b(?:\d{1,3}\.){3}\d{1,3}\b/, relevance: 3 }, { scope: 'string', match: /\b[0-9a-fA-F:]+:[0-9a-fA-F:]+\b/, relevance: 3 }, { scope: 'comment', match: /\b([0-9A-F]{2}:){15,}[0-9A-F]{2}\b/, relevance: 2 }, { scope: 'symbol', match: /\b[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}\b/i, relevance: 3 }, { scope: 'number', match: /\b\d+\b/ }], relevance: 5 },
                    // Time t=
                    { scope: 'comment', begin: /^t=/m, end: /$/m, relevance: 5 },
                    // Bandwidth b=
                    { scope: 'symbol', begin: /^b=/m, end: /$/m, relevance: 3 },
                    // Other fields (i=, u=, e=, p=, etc.)
                    { scope: 'params', begin: /^[a-z]=/im, end: /$/m, relevance: 0 }
                ]
            };
        });

        class SDPFormatterApp {
            constructor() {
                this.sdpInput = document.getElementById('sdp-input');
                this.sdpHighlight = document.getElementById('sdp-highlight');
                this.highlightCode = this.sdpHighlight.querySelector('code');
                this.formatStatus = document.getElementById('format-status');
                this.validationSummary = document.getElementById('validation-summary');
                this.summaryContent = document.getElementById('summary-content');
                this.mainElement = document.getElementById('sdp-main');
                this.measureContext = document.createElement('canvas').getContext('2d');

                this.formatTimeout = null;
                this.lastProcessedValue = '';
                this.updateMainWidth = this.updateMainWidth.bind(this);

                this.init();
            }

            init() {
                this.sdpInput.addEventListener('input', this.onInputChange.bind(this));
                this.sdpInput.addEventListener('paste', this.onInputChange.bind(this));
                this.sdpInput.addEventListener('scroll', this.syncScroll.bind(this));
                window.addEventListener('resize', this.updateMainWidth);
                this.resizeTextarea();
                this.updateHighlight();
                this.updateMainWidth();
            }

            syncScroll() {
                this.sdpHighlight.scrollTop = this.sdpInput.scrollTop;
                this.sdpHighlight.scrollLeft = this.sdpInput.scrollLeft;
            }

            updateHighlight() {
                const text = this.sdpInput.value;
                this.highlightCode.textContent = text + '\n'; // Add newline to prevent layout shift
                // Remove the highlighted flag so we can re-highlight
                delete this.highlightCode.dataset.highlighted;
                hljs.highlightElement(this.highlightCode);
                this.syncScroll();
            }

            onInputChange() {
                this.resizeTextarea();
                this.updateHighlight();
                this.updateMainWidth();

                if (this.formatTimeout) {
                    clearTimeout(this.formatTimeout);
                }

                const currentValue = this.sdpInput.value.trim();

                if (!currentValue) {
                    this.validationSummary.classList.add('hidden');
                    this.formatStatus.textContent = '';
                    this.lastProcessedValue = '';
                    return;
                }

                if (currentValue === this.lastProcessedValue) {
                    return;
                }

                this.formatStatus.textContent = 'Parsing...';

                this.formatTimeout = setTimeout(() => this.processInput(), 300);
            }

            resizeTextarea() {
                this.sdpInput.style.height = 'auto';
                this.sdpInput.style.height = this.sdpInput.clientHeight + this.sdpInput.scrollHeight + this.sdpInput.offsetHeight + 'px';
                this.sdpHighlight.style.height = this.sdpInput.style.height;
            }

            processInput() {
                const input = this.sdpInput.value.trim();
                if (!input) {
                    this.validationSummary.classList.add('hidden');
                    this.formatStatus.textContent = '';
                    return;
                }

                const parseResult = this.parseInput(input);

                if (!parseResult.success) {
                    this.formatStatus.textContent = 'Invalid format';
                    this.validationSummary.classList.add('hidden');
                    return;
                }

                this.formatStatus.textContent = `Detected: ${parseResult.format}`;
                const { sdp: cleanSdp, type: sdpType = 'offer' } = parseResult;

                const cursorPos = this.sdpInput.selectionStart;
                this.sdpInput.value = cleanSdp;
                this.lastProcessedValue = cleanSdp;
                this.updateHighlight();
                this.resizeTextarea();
                this.updateMainWidth();

                if (cursorPos <= cleanSdp.length) {
                    this.sdpInput.setSelectionRange(cursorPos, cursorPos);
                }

                this.validate(cleanSdp, sdpType ?? 'offer');
            }

            updateMainWidth() {
                if (!this.mainElement || !this.measureContext || !this.sdpInput) {
                    return;
                }

                const computed = window.getComputedStyle(this.sdpInput);
                const font = computed.font || `${computed.fontSize} ${computed.fontFamily}`;
                this.measureContext.font = font;

                const rawLines = this.sdpInput.value.split('\n');
                const lines = rawLines.length ? rawLines : [' '];
                let maxLineWidth = 0;

                lines.forEach(line => {
                    const metrics = this.measureContext.measureText(line || ' ');
                    if (metrics.width > maxLineWidth) {
                        maxLineWidth = metrics.width;
                    }
                });

                const paddingLeft = parseFloat(computed.paddingLeft) || 0;
                const paddingRight = parseFloat(computed.paddingRight) || 0;
                const borderLeft = parseFloat(computed.borderLeftWidth) || 0;
                const borderRight = parseFloat(computed.borderRightWidth) || 0;
                const chromeWidth = paddingLeft + paddingRight + borderLeft + borderRight;

                const hasContent = this.sdpInput.value.trim().length > 0;
                const targetWidth = Math.ceil(maxLineWidth + chromeWidth + 2);
                const parentWidth = this.mainElement.parentElement ? this.mainElement.parentElement.clientWidth : window.innerWidth;
                const fallbackWidth = this.mainElement.getBoundingClientRect().width || parentWidth;
                const widthCandidate = hasContent
                    ? Math.min((targetWidth || fallbackWidth), parentWidth)
                    : Math.min((fallbackWidth || parentWidth), parentWidth);
                const resolvedWidth = Math.max(widthCandidate, 0);

                this.mainElement.style.setProperty('--sdp-main-width', `${resolvedWidth}px`);
            }

            parseInput(input) {
                let trimmedInput = input.trim();

                // 1. Handle quoted strings
                if ((trimmedInput.startsWith('"') && trimmedInput.endsWith('"')) || (trimmedInput.startsWith("'") && trimmedInput.endsWith("'"))) {
                    trimmedInput = trimmedInput.slice(1, -1);
                    const unquotedResult = this.parseInput(trimmedInput);
                    if (unquotedResult.success) {
                        return { ...unquotedResult, format: `${unquotedResult.format} (quoted)` };
                    }
                }

                // 2. Try parsing as JSON
                try {
                    const parsed = JSON.parse(trimmedInput);
                    if (parsed && typeof parsed === 'object') {
                        if (parsed.sdp && parsed.type) {
                            return { success: true, sdp: parsed.sdp, type: parsed.type, format: 'JSON (RTCSessionDescription)' };
                        }
                    }
                    if (typeof parsed === 'string') {
                        return this.parseInput(parsed); // Handle double-stringified JSON
                    }
                } catch (e) {
                    // Not JSON
                }

                // 3. Check for raw SDP
                if (trimmedInput.includes('v=0')) {
                    const sdp = trimmedInput.replace(/\\r\\n/g, '\r\n').replace(/\\n/g, '\n').replace(/\\r/g, '\r');
                    return { success: true, sdp, type: null, format: 'Raw SDP' };
                }

                // 4. Last attempt to extract from a string
                const sdpMatch = trimmedInput.match(/v=0[\s\S]*/);
                if (sdpMatch) {
                    const sdp = sdpMatch[0].replace(/\\r\\n/g, '\r\n').replace(/\\n/g, '\n');
                    return { success: true, sdp, type: null, format: 'Extracted SDP' };
                }

                return { success: false, error: 'Could not parse input.' };
            }

            validate(sdp, type) {
                const errors = [];
                const warnings = [];
                let validationSuccess = false;

                console.log('Validating SDP:', sdp, type);

                try {
                    new RTCSessionDescription({ type, sdp });
                    validationSuccess = true;
                } catch (e) {
                    errors.push({ line: null, message: `RTCSessionDescription validation failed: ${e.message}` });
                }

                const lines = sdp.split('\n').map(line => line.trim()).filter(line => line);
                const lineValidation = this.validateSdpLines(lines);

                errors.push(...lineValidation.errors);
                warnings.push(...lineValidation.warnings);

                this.displayValidationSummary(validationSuccess, errors, warnings, sdp);
            }

            validateSdpLines(lines) {
                const errors = [];
                const warnings = [];
                const requiredFields = ['v=', 'o=', 's=', 't='];
                const foundFields = new Set();

                lines.forEach((line, index) => {
                    const lineNum = index + 1;
                    if (!line.match(/^[a-z]=/i)) {
                        errors.push({ line: lineNum, message: 'Invalid SDP line format (should start with "x=")' });
                        return;
                    }

                    const field = line.substring(0, 2);
                    foundFields.add(field);

                    switch (field) {
                        case 'v=':
                            if (line !== 'v=0') warnings.push({ line: lineNum, message: 'SDP version should be 0' });
                            if (index !== 0) warnings.push({ line: lineNum, message: 'Version field should be the first line' });
                            break;
                        case 'o=':
                            if (line.substring(2).split(' ').length !== 6) errors.push({ line: lineNum, message: 'Origin line should have 6 parts' });
                            break;
                        case 'm=':
                            const mParts = line.substring(2).split(' ');
                            if (mParts.length < 4) errors.push({ line: lineNum, message: 'Media line should have at least 4 parts' });
                            if (!['audio', 'video', 'application', 'data'].includes(mParts[0])) {
                                warnings.push({ line: lineNum, message: `Unknown media type: ${mParts[0]}` });
                            }
                            break;
                        case 'a=':
                            if (line.length <= 2) errors.push({ line: lineNum, message: 'Attribute line has no content' });
                            break;
                    }
                });

                requiredFields.forEach(field => {
                    if (!foundFields.has(field)) {
                        errors.push({ line: null, message: `Missing required SDP field: ${field}` });
                    }
                });

                return { errors, warnings };
            }

            displayValidationSummary(success, errors, warnings, sdp) {
                this.validationSummary.classList.remove('hidden');

                const errorCount = errors.length;
                const warningCount = warnings.length;
                const lines = sdp.split('\n').filter(line => line.trim());

                const { errorMap, warningMap } = this.buildIssueMaps(errors, warnings);
                const statusClass = success && errorCount === 0 ? 'secondary' : 'red-500';
                const statusText = success && errorCount === 0 ? 'Valid SDP' : 'Invalid SDP';

                const sections = [
                    this.renderStatusBlock(statusClass, statusText),
                    this.renderStatsBlock(lines.length, errorCount, warningCount),
                    this.renderGlobalErrorsBlock(errors),
                    this.renderLineIssuesBlock(errorMap, warningMap),
                ].filter(Boolean).join('');

                this.summaryContent.innerHTML = sections;
            }

            buildIssueMaps(errors, warnings) {
                const errorMap = new Map();
                errors.forEach(err => {
                    if (err.line) {
                        if (!errorMap.has(err.line)) errorMap.set(err.line, []);
                        errorMap.get(err.line).push(err.message);
                    }
                });

                const warningMap = new Map();
                warnings.forEach(warn => {
                    if (warn.line) {
                        if (!warningMap.has(warn.line)) warningMap.set(warn.line, []);
                        warningMap.get(warn.line).push(warn.message);
                    }
                });

                return { errorMap, warningMap };
            }

            renderStatusBlock = (statusClass, statusText) => 
                `<div class="flex items-center mb-3 p-2 bg-${statusClass}/10 border border-${statusClass}/30 rounded">
                    <div class="w-2 h-2 rounded-full mr-2 bg-${statusClass}"></div>
                    <strong>${statusText}</strong>
                </div>`;

            renderStatsBlock = (lineCount, errorCount, warningCount) =>
                `<div class="mb-3 text-sm">
                    <div class="flex justify-between mb-1"><span>Lines:</span><span class="font-mono">${lineCount}</span></div>
                    <div class="flex justify-between mb-1"><span>Errors:</span><span class="font-mono ${errorCount > 0 ? 'text-red-500' : ''}">${errorCount}</span></div>
                    <div class="flex justify-between"><span>Warnings:</span><span class="font-mono ${warningCount > 0 ? 'text-yellow-500' : ''}">${warningCount}</span></div>
                </div>`;

            renderGlobalErrorsBlock(errors) {
                const globalErrors = errors.filter(e => !e.line);
                if (globalErrors.length === 0) return '';

                return `
          <div class="mb-3 p-2 bg-red-500/10 border border-red-500/30 rounded">
            <div class="font-semibold text-red-500 mb-2 text-xs">Global Errors:</div>
            ${globalErrors.map(err => `<div class="text-xs text-red-400 mb-1">• ${this.escapeHtml(err.message)}</div>`).join('')}
          </div>`;
            }

            renderLineIssuesBlock = (errorMap, warningMap) => {
                const allLineNumbers = new Set([...errorMap.keys(), ...warningMap.keys()]);
                const sortedLines = Array.from(allLineNumbers).sort((a, b) => a - b);
                if (sortedLines.length === 0) return '';

                return 
                `<div class="border-t border-border pt-3">
                    <div class="font-semibold text-sm mb-2">Line Issues:</div>
                    <div class="space-y-2 text-xs">
                    ${sortedLines.map(lineNum => `
                        <div class="p-2 bg-background rounded border border-border">
                        <div class="font-mono text-slate-400 mb-1">Line ${lineNum}</div>
                        ${(errorMap.get(lineNum) || []).map(msg => `<div class="text-red-400 ml-2">⚠ ${this.escapeHtml(msg)}</div>`).join('')}
                        ${(warningMap.get(lineNum) || []).map(msg => `<div class="text-yellow-400 ml-2">⚠ ${this.escapeHtml(msg)}</div>`).join('')}
                        </div>
                    `).join('')}
                    </div>
                </div>`;
            }

            escapeHtml(text) {
                const div = document.createElement('div');
                div.textContent = text;
                return div.innerHTML;
            }
        }

        document.addEventListener('DOMContentLoaded', () => {
            new SDPFormatterApp();
        });
    </script>
</body>

</html>
